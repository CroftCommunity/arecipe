<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#175e54" />
    <link rel="icon" type="image/png" href="./assets/logo-light.png" />
    <title>arecipe — account</title>
    <script>
      // Pre-paint theme resolution (no flash): src/theme.ts owns it after load.
      (function () {
        try {
          var m = localStorage.getItem('theme');
          var dark =
            m === 'dark' ||
            (m !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <link rel="stylesheet" href="./assets/fonts/fonts.css" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./account.js"></script>
  </body>
</html>
