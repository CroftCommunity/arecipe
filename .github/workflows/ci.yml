# Hermetic CI: lint + typecheck + unit + build + e2e against the built bundle.
# No credentials, no live-PDS calls — the `@live` tier (real-PDS suites,
# arriving with Phase 3) runs locally as each phase's gate, NOT here.
# See plans/2026-07-07-1-plan-build-execution.md § Phase 1.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history: scripts/build.mjs derives changelog.json from `git log`
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  # Publish the built SPA to the root of the `gh-pages` branch, which GitHub
  # Pages serves at the custom domain (CNAME=arecipe.app, copied into dist by
  # the build). Read paths work on any origin (public + CORS-open, D2-verified);
  # sign-in is offered only on the production origin or loopback (authModeFor) —
  # every other origin degrades to read-only instead of crashing.
  #
  # Why a branch and not the Actions/Pages artifact source: per-PR previews
  # (.github/workflows/preview.yml) live in `gh-pages:/pr-preview/pr-N/`, and a
  # repo can have only one Pages source. The deploy publishes to the branch root
  # while preserving pr-preview/, so a production deploy never wipes live
  # previews. Flip the Pages source to "Deploy from a branch → gh-pages / root"
  # once — see docs/PREVIEWS.md § One-time setup.
  #
  # The push is plain git (scripts/pages-deploy.sh) — no third-party deploy
  # action runs with write access to the repo. See docs/PREVIEWS.md.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the built site to the gh-pages branch
    # Serialize every writer of gh-pages (this job + the preview workflow) so
    # concurrent git pushes to that branch can't race. Shared group name.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history: scripts/build.mjs derives changelog.json from `git log`
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Build-time snapshot (RUN-BUNDLE-PRECACHE): capture the seed cooks' repos
      # into .snapshot-staging/ so the build stamps + ships them. This is the one
      # networked step (reads plc.directory + each PDS); it never fails the
      # deploy — build.mjs emits a valid empty skeleton if staging is absent.
      - run: node scripts/snapshot.mjs || echo "snapshot generation failed — deploying with an empty skeleton"
      - run: npm run build
      # Publish dist/ to the gh-pages root, preserving pr-preview/.
      - run: bash scripts/pages-deploy.sh root dist "deploy ${{ github.sha }} to Pages"
