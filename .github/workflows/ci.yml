# Hermetic CI: lint + typecheck + unit + build + e2e against the built bundle.
# No credentials, no live-PDS calls — the `@live` tier (real-PDS suites,
# arriving with Phase 3) runs locally as each phase's gate, NOT here.
# See plans/2026-07-07-1-plan-build-execution.md § Phase 1.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  # Serve the static SPA from the repo via GitHub Pages. Read paths work on
  # any origin (public + CORS-open, D2-verified); sign-in stays local-only
  # until the hosted client-metadata document lands (M3) — the app detects
  # non-loopback origins and hides sign-in instead of crashing.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
