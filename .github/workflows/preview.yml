# Per-PR preview deploys. Each open pull request gets a live, throwaway copy of
# the built SPA at https://arecipe.app/pr-preview/pr-<N>/ for review and
# refinement; it's removed automatically when the PR closes.
#
# Why this works cleanly here: every asset path in the app is relative (./…),
# the manifest scope is "./", and the service worker registers against its own
# directory — so the bundle runs correctly from a /pr-preview/pr-N/ subdirectory
# with no base-URL rewriting. And because a preview is not the production origin,
# authModeFor() degrades it to read-only: previews never offer live sign-in and
# can't write to real accounts. See docs/PREVIEWS.md.
#
# No third-party actions: the deploy is plain git (scripts/pages-deploy.sh) and
# the PR comment is actions/github-script (first-party). Nothing an individual
# maintains runs here with write access.
name: preview

on:
  pull_request:
    # `closed` is included so the preview is torn down on merge/close.
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write # push the preview into the gh-pages branch
  pull-requests: write # comment the preview URL on the PR

# Share the `gh-pages` group with the production deploy (ci.yml) so writers of
# that branch serialize instead of racing on `git push`.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    # Trusted, same-repo PRs only. A fork PR carries a read-only token that
    # can't push gh-pages or comment, so skip it rather than fail loudly — no
    # untrusted diff is ever built with write access here.
    if: github.event.pull_request.head.repo.full_name == github.repository
    env:
      PR: ${{ github.event.pull_request.number }}
      PREVIEW_URL: https://arecipe.app/pr-preview/pr-${{ github.event.pull_request.number }}/
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Build only when there's something to preview. On `closed` we skip
      # straight to teardown.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: github.event.action != 'closed'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: github.event.action != 'closed'
      - run: npm run build
        if: github.event.action != 'closed'
      # The custom domain belongs to the branch root, not the preview subtree; a
      # stray CNAME under pr-preview/ is ignored by Pages, but drop it so the
      # preview tree carries nothing that pretends to own the domain.
      - run: rm -f dist/CNAME
        if: github.event.action != 'closed'

      - name: Deploy preview
        if: github.event.action != 'closed'
        run: bash scripts/pages-deploy.sh "pr-preview/pr-${PR}" dist "preview PR #${PR} (${{ github.sha }})"

      - name: Remove preview
        if: github.event.action == 'closed'
        run: bash scripts/pages-deploy.sh "pr-preview/pr-${PR}" --remove "remove preview PR #${PR}"

      # Sticky comment: one comment per PR, updated in place (no thread spam).
      - name: Comment preview status
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const marker = '<!-- pr-preview -->';
            const closed = context.payload.action === 'closed';
            const sha = context.sha.slice(0, 7);
            const body = closed
              ? `${marker}\n🧹 Preview for this PR was removed (PR closed).`
              : `${marker}\n🔎 **Live preview:** ${process.env.PREVIEW_URL}\n\n`
                + `Read-only (no live sign-in — it's not the production origin). Updated for \`${sha}\`.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
