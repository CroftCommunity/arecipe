# Android TWA shell release (plan 2026-07-18-1 D6): tag `android-v*` →
# gate → build + sign → verify certificate → GitHub Release carrying the
# sideloadable APK. The app is a thin Trusted Web Activity shell over the
# live https://arecipe.app — web deploys update its content with no new
# APK, so these releases are occasional and decoupled from web releases.
#
# workflow_dispatch exists for two reasons: a `dry_run` proves the whole
# build+verify pipeline without a tag (publish is skipped), and dispatching
# ON a tag ref re-publishes if a tag-push run failed downstream.
#
# Secrets (installed once by the owner — ceremony in docs/ANDROID-APP.md):
#   ANDROID_KEYSTORE_BASE64     base64 of the release keystore file
#   ANDROID_KEYSTORE_PASSWORD   keystore password
#   ANDROID_KEY_PASSWORD        key password (alias `arecipe`)
# The keystore never touches the repo; the workflow FAILS (in
# scripts/android-build.sh) if the signing certificate's SHA-256 differs
# from android/expected-cert-sha256.txt — the same committed constant the
# gate pins the served assetlinks.json to, so app and site cannot desync.
name: android-release

on:
  push:
    tags: ['android-v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify, but skip publishing the release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # The same full gate as ci.yml — a shell release never ships from a red tree.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  build:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # versionCode = `git rev-list --count HEAD` needs full history
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 17 # Bubblewrap 1.24's supported JDK
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "FATAL: ANDROID_KEYSTORE_BASE64 secret is not installed." >&2
            echo "Run the keystore ceremony in docs/ANDROID-APP.md first." >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android.keystore
      - name: Build, sign, and verify the TWA
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/android-build.sh
      - name: Remove keystore
        if: always()
        run: rm -f android.keystore .android-build/android.keystore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-release
          path: |
            .android-build/arecipe.apk
            .android-build/SHA256SUMS
          if-no-files-found: error

  # Publishes only for a real tag (a branch dispatch has no tag to release
  # from — it is inherently a dry run) and only when dry_run wasn't asked for.
  publish:
    if: github.ref_type == 'tag' && inputs.dry_run != true
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release + upload assets
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android-release
      # First-party `gh` only — same posture as the Pages deploy (no
      # third-party action runs with write access to the repo).
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "arecipe Android app $GITHUB_REF_NAME" \
            --notes-file android/release-notes-template.md \
            arecipe.apk SHA256SUMS
