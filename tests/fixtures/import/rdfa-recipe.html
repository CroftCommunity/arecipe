<!doctype html>
<html lang="en">
  <head><title>Herb Focaccia</title></head>
  <body>
    <div vocab="https://schema.org/" typeof="Recipe">
      <h1 property="name">Herb Focaccia</h1>
      <p property="description">A dimpled, olive-oil-rich focaccia.</p>
      <ul>
        <li property="recipeIngredient">500 g bread flour</li>
        <li property="schema:recipeIngredient">2 tsp salt</li>
        <li property="recipeIngredient">350 ml water</li>
      </ul>
      <div property="recipeInstructions">Mix and rest the dough.</div>
      <div property="recipeInstructions">Dimple, oil, and bake.</div>
    </div>
  </body>
</html>
