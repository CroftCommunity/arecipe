<!doctype html>
<html lang="en">
  <head>
    <title>Layer Cake</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Recipe",
        "name": "Layer Cake",
        "recipeIngredient": ["2 cups flour", "1 cup sugar", "1 cup frosting"],
        "recipeInstructions": [
          {
            "@type": "HowToSection",
            "name": "Cake",
            "itemListElement": [
              { "@type": "HowToStep", "text": "Cream butter and sugar." },
              { "@type": "HowToStep", "text": "Fold in the flour and bake." }
            ]
          },
          {
            "@type": "HowToSection",
            "name": "Frosting",
            "itemListElement": [
              { "@type": "HowToStep", "text": "Whip the frosting until fluffy." },
              { "@type": "HowToStep", "text": "Spread between the cooled layers." }
            ]
          }
        ]
      }
    </script>
  </head>
  <body></body>
</html>
