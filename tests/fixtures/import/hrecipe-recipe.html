<!doctype html>
<html lang="en">
  <head><title>Iced Mint Tea</title></head>
  <body>
    <div class="h-recipe">
      <h1 class="p-name">Iced Mint Tea</h1>
      <ul>
        <li class="p-ingredient">4 tea bags</li>
        <li class="p-ingredient">1 handful mint</li>
        <li class="p-ingredient">1 liter water</li>
      </ul>
      <div class="e-instructions">
        <p>Boil the water and steep the tea.</p>
        <p>Add the mint and chill.</p>
      </div>
    </div>
  </body>
</html>
