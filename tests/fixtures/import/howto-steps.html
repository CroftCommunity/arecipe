<!doctype html>
<html lang="en">
  <head>
    <title>Scrambled Eggs</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Recipe",
        "name": "Scrambled Eggs",
        "description": "Soft and slow.",
        "recipeIngredient": ["3 eggs", "1 tablespoon butter", "salt"],
        "recipeInstructions": [
          { "@type": "HowToStep", "name": "Beat", "text": "Beat the eggs with a pinch of salt." },
          { "@type": "HowToStep", "text": "Melt butter over low heat." },
          { "@type": "HowToStep", "text": "Add eggs and stir gently until just set." }
        ]
      }
    </script>
  </head>
