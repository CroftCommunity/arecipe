<!doctype html>
<html lang="en">
  <head><title>Quick Salsa</title></head>
  <body>
    <div class="hrecipe">
      <h2 class="fn">Quick Salsa</h2>
      <ul>
        <li class="ingredient">3 tomatoes</li>
        <li class="ingredient">1 onion</li>
        <li class="ingredient">1 lime</li>
      </ul>
      <div class="instructions">
        <p>Dice everything and combine.</p>
        <p>Season and rest ten minutes.</p>
      </div>
    </div>
  </body>
</html>
