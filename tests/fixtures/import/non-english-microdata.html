<!doctype html><html lang="fr"><head><title>Crêpes</title></head>
<body>
<article itemscope itemtype="https://schema.org/Recipe">
  <h1 itemprop="name">Crêpes de froment</h1>
  <ul>
    <li itemprop="recipeIngredient">250 g de farine</li>
    <li itemprop="recipeIngredient">4 œufs</li>
    <li itemprop="recipeIngredient">500 ml de lait</li>
    <li itemprop="recipeIngredient">1 pincée de sel</li>
  </ul>
  <p>Portions : <span itemprop="recipeYield">12 crêpes</span></p>
  <ol>
    <li itemprop="recipeInstructions">Mélanger la farine et les œufs.</li>
    <li itemprop="recipeInstructions">Ajouter le lait peu à peu.</li>
    <li itemprop="recipeInstructions">Cuire dans une poêle chaude.</li>
  </ol>
</article>
</body></html>
