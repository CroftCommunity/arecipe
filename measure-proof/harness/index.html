<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>measure-proof PWA harness</title>
  </head>
  <body>
    <h1>measure-proof harness</h1>
    <p id="status">booting…</p>
    <script type="module">
      import './client.js';
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').then(() => {
          document.getElementById('status').textContent = 'ready';
        });
      } else {
        document.getElementById('status').textContent = 'ready (no sw)';
      }
    </script>
  </body>
</html>
